<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16405f"/>
      <stop offset="1" stop-color="#0f2b46"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <!-- circuit lines -->
  <g stroke="#facc15" stroke-width="2" fill="none" opacity="0.25">
    <path d="M0 80 H300 L360 140 H700"/>
    <path d="M1600 120 H1300 L1240 180 H900"/>
    <path d="M0 300 H200 L260 360 H540"/>
    <path d="M1600 340 H1350 L1290 400 H1000"/>
  </g>
  <g fill="#facc15" opacity="0.5">
    <circle cx="700" cy="140" r="6"/><circle cx="900" cy="180" r="6"/>
    <circle cx="540" cy="360" r="6"/><circle cx="1000" cy="400" r="6"/>
  </g>
  <!-- city skyline -->
  <g fill="#1e3a55">
    <rect x="80" y="380" width="120" height="220"/>
    <rect x="220" y="300" width="90" height="300"/>
    <rect x="330" y="420" width="140" height="180"/>
    <rect x="1120" y="350" width="110" height="250"/>
    <rect x="1250" y="280" width="100" height="320"/>
    <rect x="1370" y="400" width="150" height="200"/>
  </g>
  <!-- windows -->
  <g fill="#facc15" opacity="0.7">
    <rect x="100" y="410" width="14" height="14"/><rect x="140" y="410" width="14" height="14"/>
    <rect x="100" y="450" width="14" height="14"/><rect x="180" y="450" width="14" height="14"/>
    <rect x="240" y="330" width="14" height="14"/><rect x="280" y="370" width="14" height="14"/>
    <rect x="1265" y="310" width="14" height="14"/><rect x="1305" y="350" width="14" height="14"/>
    <rect x="1135" y="380" width="14" height="14"/><rect x="1175" y="430" width="14" height="14"/>
  </g>
  <!-- crane -->
  <g stroke="#ca8a04" stroke-width="8" fill="none">
    <path d="M700 600 V200"/>
    <path d="M700 200 H1050"/>
    <path d="M700 200 L820 260"/>
    <path d="M1050 200 V260"/>
  </g>
  <rect x="1035" y="260" width="30" height="24" fill="#ca8a04"/>
  <!-- ground -->
  <rect x="0" y="580" width="1600" height="20" fill="#0b1f33"/>
</svg>
