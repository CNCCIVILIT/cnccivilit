<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Water Systems Squad</title>
  <desc id="dsc">Sample banner for the Water Systems Squad</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="tex" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>
  <rect width="480" height="280" fill="url(#tex)"/>
  <circle cx="404" cy="52" r="86" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="60" cy="236" r="72" fill="#ffffff" fill-opacity=".07"/>
  <g opacity=".9">
    <rect x="34" y="46" width="64" height="64" rx="16" fill="#ffffff" fill-opacity=".18"/>
    <text x="66" y="80" font-family="'Segoe UI Symbol','Segoe UI Emoji',Arial,sans-serif" font-size="36" text-anchor="middle" dominant-baseline="central">&#127754;</text>
  </g>
  <text x="34" y="168" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Water Systems Squad</text>
  <text x="34" y="200" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" fill="#e2e8f0">Hydraulics paired with monitoring</text>
  <rect x="34" y="220" width="96" height="5" rx="3" fill="#facc15"/>
  <text x="34" y="252" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#fde68a">6 MEMBERS</text>
  <rect x="4" y="4" width="472" height="272" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="3"/>
</svg>
